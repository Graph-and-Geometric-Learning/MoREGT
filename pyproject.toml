[project]
name = "moregt"
version = "1.0.0"
description = "MoREGT: a two-level relational graph transformer with signature-routed mixture-of-experts layers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torch_geometric>=2.6",
    "pytorch-frame>=0.2",
    "relbench>=1.0",
    "sentence-transformers>=3.0",
    "pytorch-lightning>=2.2",
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moregt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
